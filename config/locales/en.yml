# English strings for redmine_final_date plugin
en:
  label_check_settings: "Validate subtasks considering start date change?"
  label_check_subtask: "Validate all subtasks (yes) or only those with changed start date (no)"
  label_parent_final_date: "Final date from the parent issue"
  error_subtask_start_date_after_parent_final_date: "of the subtask (%{start_date}) cannot be later than the parent issue's final date (%{final_date})"
  label_auto_date_update_settings: "Automated Date Update"
  label_filter_id: "Issue filter (saved query)"
  label_date_mode: "Date calculation mode"
  label_date_mode_add_to_field: "Add N working days to current field value"
  label_date_mode_add_to_today: "Add N working days to today's date"
  label_date_mode_set_fixed: "Set a fixed date"
  label_date_days: "Working days to add"
  hint_date_days: "Integer; used for 'add to field' and 'add to today' modes"
  label_date_fixed: "Fixed date (YYYY-MM-DD)"
  label_comment_text: "Journal comment text"
  hint_comment_text: "Use {{date}} to insert the new final date into the comment text"
  label_acting_user_id: "Acting user (global)"
  hint_acting_user_id: "User who performs updates. Leave blank to use per-issue responsible field. Falls back to first active admin."
  label_responsible_field_id: "Responsible user field (fallback)"
  hint_responsible_field_id: "User-type custom field on issue; used when global acting user is not set."
  label_cron_schedule: "Cron schedule"
  label_cron_command: "Cron command"
  label_rfd_sync_section: "Final date on subtasks"
  label_rfd_sync_subtasks: "Keep every subtask's final date equal to its top-level issue's"
  hint_rfd_sync_subtasks: "A subtask takes the date when it is created, on each of its own saves and when it is moved to another parent. Changing or clearing the date on the top-level issue reaches every subtask at once, closed ones included, with no journal entry and no notification on them. Mismatches that built up earlier are repaired once by rake redmine:final_date:sync_subtasks (report only without APPLY=1)."
  label_rfd_overdue_section: "Final date in the past"
  label_rfd_overdue_guard: "Do not let employees save a top-level issue whose final date has passed"
  hint_rfd_overdue_guard: "Applies when, after the save, the issue is in one of the selected statuses and assigned to an employee or a group from the list below. A save that moves the date to today or later, clears it, hands the issue to the customer or takes it out of the listed statuses goes through. Customers and automation (dispatcher, scenarios, background jobs) are not affected."
  label_rfd_overdue_status_ids: "Statuses in which the issue cannot be saved"
  label_rfd_staff_group_ids: "Employee groups"
  hint_rfd_staff_group_ids: "An employee is a member of any selected group. Select a department queue group as well to cover issues assigned to that queue. Administrators are never bound by these rules, even when they belong to a selected group. Until groups are selected the rules apply to nobody."
  label_rfd_block_subtasks: "Do not let employees create subtasks when the top-level issue's final date has passed"
  hint_rfd_block_subtasks: "At any nesting depth and whatever the status of the top-level issue. Moving an existing issue into such a branch is refused as well."
  error_rfd_final_date_overdue: "The final date (%{date}) has passed. Move it to today or later, or clear it — otherwise the issue cannot be saved in this status while assigned to an employee."
  error_rfd_subtask_under_overdue_owner: "The final date of issue #%{id} (%{date}) has passed, so no new subtasks can be created under it. Move or clear the final date on issue #%{id} first."
  error_rfd_overdue_date_first: "The final date (%{date}) has passed. Move it to today or later, or clear it first — after that the issue can be made a subtask or switched to another tracker."

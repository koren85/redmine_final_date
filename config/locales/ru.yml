  label_rfd_sync_subtasks: "Держать итоговую дату подзадач равной дате задачи верхнего уровня"
  hint_rfd_sync_subtasks: "Подзадача получает дату при создании, при любом своём сохранении и при переносе к другому родителю. Смена или очистка даты у задачи верхнего уровня сразу доходит до всех подзадач, включая закрытые, — без записи в их истории и без уведомлений. Расхождения, накопившиеся раньше, один раз выравнивает команда rake redmine:final_date:sync_subtasks (без APPLY=1 — только отчёт)."
  label_rfd_overdue_section: "Итоговая дата в прошлом"
  label_rfd_overdue_guard: "Не давать сотрудникам сохранять задачу верхнего уровня с прошедшей итоговой датой"
  hint_rfd_overdue_guard: "Действует, когда задача после сохранения остаётся в одном из выбранных статусов и назначена сотруднику или группе из списка ниже. Проходит сохранение, которое переносит дату на сегодня или позже, убирает дату, передаёт задачу заказчику или переводит её в статус не из списка. Заказчиков и автоматики (диспетчер, сценарии, фоновые задачи) запрет не касается."
  label_rfd_overdue_status_ids: "Статусы, в которых сохранять нельзя"
  label_rfd_staff_group_ids: "Группы сотрудников"
  hint_rfd_staff_group_ids: "Сотрудник — участник любой из выбранных групп. Чтобы запрет действовал и при назначении на очередь отдела, выберите и группу-очередь. На администраторов запреты не действуют, даже если они состоят в выбранной группе. Пока группы не выбраны, запреты не действуют ни на кого."
  label_rfd_block_subtasks: "Не давать сотрудникам создавать подзадачи, если итоговая дата задачи верхнего уровня прошла"
  hint_rfd_block_subtasks: "На любом уровне вложенности и при любом статусе задачи верхнего уровня. Перенести существующую задачу в такую ветку тоже нельзя."
  error_rfd_final_date_overdue: "Итоговая дата (%{date}) уже прошла. Перенесите её на сегодня или позже либо уберите — иначе сохранить задачу в этом статусе на сотруднике нельзя."
  error_rfd_subtask_under_overdue_owner: "Итоговая дата задачи #%{id} (%{date}) уже прошла, новые подзадачи по ней создавать нельзя. Сначала перенесите или уберите итоговую дату в задаче #%{id}."
  error_rfd_overdue_date_first: "Итоговая дата (%{date}) уже прошла. Сначала перенесите её на сегодня или позже либо уберите — после этого задачу можно сделать подзадачей или сменить ей трекер."
